# Docker's embedded DNS: upstreams are re-resolved, so recreating the backend/frontend
# containers (new IPs after `docker compose up -d --build`) never leaves Nginx pointing at a dead address.
resolver 127.0.0.11 valid=10s ipv6=off;
server_tokens off;

# Real client IP when a reverse proxy runs on the host (aaPanel): only the host / Docker bridge is trusted,
# and the right-most untrusted X-Forwarded-For entry is used, so a client cannot spoof it. No effect otherwise.
set_real_ip_from 127.0.0.1;
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Security headers for the web app (the API sets its own). The CSP forbids inline/external scripts:
# the build runs with INLINE_RUNTIME_CHUNK=false so that index.html has no inline <script>.
map $host $gofix_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    set $gofix_backend http://backend:8001;
    set $gofix_frontend http://frontend:80;

    # Décommenter une fois HTTPS configuré :
    # return 301 https://$host$request_uri;

    location /api/ {
        proxy_pass $gofix_backend;
        proxy_set_header Host $host;
        # Both headers are *overwritten* with the TCP peer address: a client cannot spoof its IP (rate limits, lockouts, audit).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass $gofix_frontend;
        proxy_set_header Host $host;
        proxy_hide_header X-Powered-By;
        add_header Content-Security-Policy $gofix_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }
}

