services:
  mongo:
    # MONGO_VERSION=4.4 in .env on a server whose CPU has no AVX (MongoDB 5+ requires AVX).
    image: mongo:${MONGO_VERSION:-7}
    restart: unless-stopped
    # By default MongoDB keeps ~half of the RAM for its cache (≈3.5 GB on the 8 GB VPS): cap it to leave room for the
    # other services (and the future vision container). Raise MONGO_CACHE_GB in .env when the data grows.
    command: ["--wiredTigerCacheSizeGB", "${MONGO_CACHE_GB:-1.5}"]
    environment:
      # Set MONGO_ROOT_USER/MONGO_ROOT_PASSWORD in .env (production) to enable authentication on a NEW volume,
      # and put the same credentials in MONGO_URL. Empty = no auth (local development).
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-}
    volumes:
      - mongo_data:/data/db
      - ./backups:/backups
    healthcheck:
      # mongosh ships with MongoDB 6+, the legacy mongo shell with 4.4/5.0.
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\")' || mongo --quiet --eval 'db.adminCommand(\"ping\")'"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017}
      STORAGE_LOCAL_ROOT: /data/storage
      # Several workers use both vCPUs; they share their rate limits through Redis.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    volumes:
      - storage_data:/data/storage
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    # Shared rate-limit counters only (no persistence, 64 MB at most). Not exposed outside the Docker network.
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-ttl"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    env_file: .env
    environment:
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017}
      TEST_DB_NAME: gofix_test
      STORAGE_LOCAL_ROOT: /tmp/storage
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: ""
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      # Behind aaPanel (its own Nginx owns 80/443): HTTP_BIND=127.0.0.1:8080 and HTTPS_BIND=127.0.0.1:8443 in .env
      - "${HTTP_BIND:-80}:80"
      - "${HTTPS_BIND:-443}:443"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - storage_data:/data/storage:ro
    depends_on:
      - frontend
      - backend

volumes:
  mongo_data:
  storage_data:
