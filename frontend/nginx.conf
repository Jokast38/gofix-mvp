server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri /index.html;
    }
}
