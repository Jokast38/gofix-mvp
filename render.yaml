# Render Blueprint – TEST environment (demo data, simulated payments, e-mails in the logs), built from a Dockerfile.
# One Docker service = web app + API (deploy/render/Dockerfile). Database: MongoDB Atlas (free M0), URI asked at creation.
# Not for production: the production server is the Algérie Télécom VPS (docker-compose.yml, docs/dossier/GoFix_Guide_Installation).
services:
  - type: web
    name: gofix
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: staging
      - key: DB_NAME
        value: gofix
      - key: MONGO_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CONFIG_ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@gofix.dz
      - key: ADMIN_PASSWORD
        sync: false
      # Public URL (payment return pages, links in e-mails). Adjust if Render gives another name (Dashboard → URL).
      - key: FRONTEND_URL
        value: https://gofix.onrender.com
      - key: CORS_ORIGINS
        value: https://gofix.onrender.com
      - key: STORAGE_LOCAL_ROOT
        value: /data/storage
      - key: PAYMENT_PROVIDER
        value: mock
      - key: EMAIL_PROVIDER
        value: console
      - key: SMS_PROVIDER
        value: console
      - key: LLM_PROVIDER
        value: none
      - key: MOBILE_APP_SCHEME
        value: gofix
